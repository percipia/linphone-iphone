.runners:
  tags:
    - macosx-xcode
  before_script:
    - xcodebuild -version
    - xcodebuild -showsdks
    - export PATH="/opt/homebrew/opt/ruby@3.3/bin:$PATH"
    - export GEM_HOME="$CI_PROJECT_DIR/.gem"
    - export PATH="$GEM_HOME/bin:$PATH"
    - gem install bundler -v 2.4.19 --no-document
    - bundle config set --local path "$CI_PROJECT_DIR/vendor/bundle"
    - bundle install --jobs 4 --retry 3
    - |
      if [ -n "$VAR_APPLE_API_KEY" ]; then
        mkdir -p ~/.appstoreconnect
        echo "$VAR_APPLE_API_KEY" | base64 -d > ~/.appstoreconnect/AuthKey.p8
        chmod 600 ~/.appstoreconnect/AuthKey.p8
        export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/AuthKey.p8"
      fi
  after_script:
    - /Users/Shared/cleanup-fastlane-keychain.sh

variables:
  HOMEBREW_NO_AUTO_UPDATE: 1
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  TEAM_ID: "${VAR_TEAM_ID}"
  APPLE_API_KEY_ID: "${VAR_APPLE_API_KEY_ID}"
  APPLE_API_ISSUER_ID: "${VAR_APPLE_API_KEY_ISSUER_ID}"
  MATCH_GIT_URL: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${VAR_MATCH_GIT_URL}"
  MATCH_PASSWORD: "${VAR_MATCH_PASSWORD}"

stages:
  - debug
  - prod
  - upload

build-debug:
  extends:
    - .runners
  stage: debug
  script:
    - bundle exec fastlane ios build_debug
  artifacts:
    paths:
      - build/
    when: always
    expire_in: 1 day
  only:
    - branches

build-prod:
  extends:
    - .runners
  stage: prod
  script:
    - bundle exec fastlane ios build_prod
  artifacts:
    paths:
      - build/
    when: always
    expire_in: never
  only:
    - tags

upload-testflight:
  extends:
    - .runners
  stage: upload
  script:
    - bundle exec fastlane ios upload_testflight
  dependencies:
    - build-prod
  only:
    - tags
